<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Calculator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons for GitHub, LinkedIn, Email -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='calc.css') }}">
</head>
<body>

    <h1>AI-Powered Calculator</h1>

    <div class="calculator">
        <!-- Display Screen -->
        <input type="text" id="display" placeholder="0" readonly>

        <!-- Ask AI Box -->
        <div class="ai-box">
            <input type="text" id="ai-prompt" placeholder="e.g. 15% tip on $80 or simple interest...">
            <button id="ai-btn">✨ Ask AI</button>
        </div>

        <!-- Calculator Buttons Grid -->
        <div class="buttons">
            <button class="btn clear">C</button>
            <button class="btn operator">/</button>
            <button class="btn operator">*</button>
            <button class="btn operator">-</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator">+</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn equal">=</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">0</button>
        </div>

        <!-- Social Links Footer -->
        <div class="social-links">
            <a href="https://github.com/TheHimanshuMishraXD" target="_blank" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://linkedin.com/in/himanshu-mishra-904264380" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:himanshumishra75952@gmail.com" title="Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>

        <!-- How to Use Section -->
        <div class="how-to-use">
            <h3><i class="fas fa-lightbulb"></i> How to Use</h3>
            <ul>
                <li><strong>Basic Math:</strong> Buttons click karke regular calculations karo (+, -, *, /).</li>
                <li><strong>AI Queries:</strong> Prompt box mein normal English mein question likho (e.g. <em>"15% of 800"</em> ya <em>"square root of 144"</em>).</li>
                <li><strong>Get Result:</strong> ✨ Ask AI button click karo ya <code>Enter</code> key press karo.</li>
            </ul>
        </div>
    </div>

    <!-- JS Link -->
    <script src="{{ url_for('static', filename='calc.js') }}"></script>
</body>
</html>
