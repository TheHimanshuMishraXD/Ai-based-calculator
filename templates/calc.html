<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='calc.css') }}">
</head>
<body>

    <h1>AI-Powered Calculator</h1>

    <div class="calculator">
        <input type="text" id="display" placeholder="0" readonly>

        <div class="ai-box">
            <input type="text" id="ai-prompt" placeholder="e.g. 15% tip on $80 or simple interest...">
            <button id="ai-btn">✨ Ask AI</button>
        </div>

        <div class="buttons">
            <button class="btn clear">C</button>
            <button class="btn operator">/</button>
            <button class="btn operator">*</button>
            <button class="btn operator">-</button>

            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator">+</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn equal">=</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">0</button>
        </div>

        <!-- social media footer section  -->
         <div class="social-links"
             <a href="https://github.com/himanshumishra41157-tech" target="_blank" title="GitHub">
                <i class ="fab fa-github"></i>
             </a>

    </div>


    <script src="{{ url_for('static', filename='calc.js') }}"></script>
</body>
</html>
